version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile 
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:9076"
    volumes:
      - .:/app
    ports:
      - "9076:9076"
    env_file: 
      - env/.env.local
